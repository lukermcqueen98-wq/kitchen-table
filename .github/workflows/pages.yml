# Publishes Kitchen Table to GitHub Pages in about a minute, keeping whatever all-cards picture index was
# built last. The index itself is only built when you run "Build card index" (card-index.yml).
#
# One-time setup: repo Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Its own queue, so publishing the app never waits behind a long index build
concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.app-deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Restore the card index from the last run
        uses: actions/cache/restore@v5
        with:
          path: site/index
          key: card-index-${{ github.run_id }}
          restore-keys: card-index-

      - name: Keep the published card index
        if: hashFiles('site/index/cards.json') == ''
        run: |
          site="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          mkdir -p site/index
          curl -fsSL "$site/index/cards.json" -o site/index/cards.json && curl -fsSL "$site/index/cards.bin" -o site/index/cards.bin \
            || rm -f site/index/cards.json site/index/cards.bin

      - name: Assemble the site
        run: cp index.html README.md site/

      - uses: actions/configure-pages@v6

      # What actions/upload-pages-artifact does, with the Node 24 version of upload-artifact
      - name: Pack the site for GitHub Pages
        run: tar --dereference --hard-dereference --directory site -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .

      - uses: actions/upload-artifact@v6
        with:
          name: app
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - id: app-deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: app
