# Builds or updates the all-cards picture index for AI card matching, then publishes the site with it.
# Runs only when you start it: Actions > Build card index > Run workflow.
# tools/build-index.mjs keeps progress in the Actions cache and saves it every few minutes and when a run is
# stopped, so the first build (a few hours) can be split across runs, and later runs only add new cards.
name: Build card index

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: card-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Restore the card index from the last run
        uses: actions/cache/restore@v5
        with:
          path: site/index
          key: card-index-${{ github.run_id }}
          restore-keys: card-index-

      # GitHub drops cached data unused for 7 days. Without it, start from the index the live site already
      # publishes, so a missed week means a quick update instead of rebuilding every card from scratch.
      - name: Fall back to the published card index
        if: hashFiles('site/index/cards.json') == ''
        run: |
          site="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          mkdir -p site/index
          if curl -fsSL "$site/index/cards.json" -o site/index/cards.json && curl -fsSL "$site/index/cards.bin" -o site/index/cards.bin; then
            echo "Starting from the published index."
          else
            rm -f site/index/cards.json site/index/cards.bin
            echo "No published index yet; building from scratch."
          fi

      - name: Install the index builder
        run: npm ci --prefix tools --no-audit --no-fund

      - name: Build or update the card index
        env:
          MAX_MINUTES: "300"
        run: node tools/build-index.mjs site/index

      - name: Save the card index for the next run
        if: always() && hashFiles('site/index/cards.json') != ''
        uses: actions/cache/save@v5
        with:
          path: site/index
          key: card-index-${{ github.run_id }}

      # The build can take hours; publish the newest app from main, not the one this run started with
      - name: Assemble the site with the latest app
        run: |
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD -- index.html README.md
          cp index.html README.md site/

      - uses: actions/configure-pages@v6

      # What actions/upload-pages-artifact does, with the Node 24 version of upload-artifact
      - name: Pack the site for GitHub Pages
        run: tar --dereference --hard-dereference --directory site -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .

      - uses: actions/upload-artifact@v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
