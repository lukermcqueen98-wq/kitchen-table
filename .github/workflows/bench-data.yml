# Downloads the matching benchmark's data (real card pictures and the AI model, tools/eval/fetch-data.mjs) and
# saves it to the bench-data branch, so the benchmark can run on computers that can't reach Scryfall or Hugging
# Face. The branch holds only that data (about 150 MB) and is replaced each run; nothing else uses it.
name: Benchmark data

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/bench-data.yml", "tools/eval/fetch-data.mjs"]

permissions:
  contents: write

concurrency:
  group: bench-data
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci --prefix tools --no-audit --no-fund
      - name: Get the published card index's card list
        run: |
          mkdir -p site/index
          curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/index/cards.json" -o site/index/cards.json
      - name: Download cards and the model
        run: node tools/eval/fetch-data.mjs "$RUNNER_TEMP/bench-data" 300 2700
      - name: Save to the bench-data branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/bench-data"
          printf 'Data for the Kitchen Table matching benchmark (made by .github/workflows/bench-data.yml). Card pictures are from Scryfall.\n' > README.md
          git init -q -b bench-data
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Matching benchmark data"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" bench-data
